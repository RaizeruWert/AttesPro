services:
  - type: web
    name: attestpro
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations core && python manage.py migrate && python manage.py seed_checklist && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
